#####################################################################
#  Chamber Filtration Control Macro Module
#####################################################################

[gcode_macro _FILTER_VARIABLES]
# Default post-print safety purge duration in seconds (900s = 15 minutes)
variable_purge_time: 900

# Configuration dictionary for material-to-filter fan speed (0.0 to 1.0)
variable_material_speeds: {
    'ABS': 1.0,
    'ASA': 1.0,
    'HIPS': 1.0,
    'PA': 0.0,    # Nylon: Off to prevent moisture saturation of carbon
    'PC': 0.0,    # Polycarbonate: Off
    'PLA': 0.0,   # PLA: Off to prevent heat creep / preserve carbon life
    'PETG': 0.0   # PETG: Off
  }
gcode:
    # Intentionally left blank. Used purely as a namespace container.

[gcode_macro FILTER_CONTROL]
description: Sets the chamber filter fan speed based on the specified filament material type.
gcode:
    {% set material = params.MATERIAL|default("ABS")|upper|string %}
    {% set speeds = printer["gcode_macro _FILTER_VARIABLES"].material_speeds %}
    
    # Cancel any pending shutdown timers if we are starting a new target or resetting
    UPDATE_DELAYED_GCODE ID=_PURGE_FILTER_DELAY DURATION=0
    
    # Determine fan speed from dictionary; fallback to 0.0 if material is unrecognized
    {% set speed = speeds[material] if material in speeds else 0.0 %}
    
    # Verify hardware existence before pushing command updates
    {% if 'fan_generic Filter' in printer %}
        {% if speed > 0.0 %}
            RESPOND MSG="Chamber Filter: Setting fan speed to {speed * 100}% for {material}."
        {% endif %}
        SET_FAN_SPEED FAN=Filter SPEED={speed}
    {% else %}
        RESPOND MSG="Chamber Filter: No 'fan_generic Filter' device configured on this machine. Skipping control."
    {% endif %}

[gcode_macro FILTER_PURGE_START]
description: Initiates a post-print delayed clearing countdown cycle to scrub residual VOCs.
gcode:
    # Read the purge time variable from the configuration namespace
    {% set default_purge = printer["gcode_macro _FILTER_VARIABLES"].purge_time|int %}
    # Allow overriding via parameters if desired, otherwise use our config default
    {% set purge_time = params.TIME|default(default_purge)|int %} 
    
    {% if 'fan_generic Filter' in printer %}
        # Only launch the countdown loop if the filter is currently active
        {% if printer["fan_generic Filter"].speed > 0.0 %}
            RESPOND MSG="Chamber Filter: Print finished. Running air safety purge loop for {purge_time // 60} minutes..."
            UPDATE_DELAYED_GCODE ID=_PURGE_FILTER_DELAY DURATION={purge_time}
        {% endif %}
    {% endif %}

[delayed_gcode _PURGE_FILTER_DELAY]
gcode:
    {% if 'fan_generic Filter' in printer %}
        RESPOND MSG="Chamber Filter: Safety chamber purge cycle finished. Powering down filter fan."
        SET_FAN_SPEED FAN=Filter SPEED=0.0
    {% endif %}
#    X     X    X  X       X         X       X X  X    X  XXX  X  X        X
#    X     XXXXXX  X       XXXXX     X      XXXXX XXXXXX  X XX X  X        XXXXX
#    X     X    X  X       X         X     X    X X    X  X  XXX  X        X
#  XXXXX   X    X  XXXXXX  XXXXXXX   X    X      XX    X  X   XX  XXXXXX   XXXXXX
#
#                        INERTIA CUBE — 300x300x250 AWD CoreXY
#           BTT Octopus | Fysetc H36 Combo V1.3 | Cartographer | 4x QGL

#-------------------------#
#   INCLUDES              #
#-------------------------#

[include mainsail.cfg]
[include configs/printers/inertia_cube/inertia_cube_settings.cfg]
[include macros/macros.cfg]
[include macros/Line_Purge.cfg]
[include macros/Smart_Park.cfg]
#[include macros/nozzle_brush.cfg]   # No nozzle brush installed yet
[include macros/git_functions.cfg]
[include macros/toolhead_led.cfg]
#[include macros/hardware/bedfan.cfg]  # Uncomment when bedfan feature is ready
#[include macros/kalico.cfg]
[exclude_object]


#-------------------------#
#   PRINTER               #
#-------------------------#

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 15
minimum_cruise_ratio: 0.0

[force_move]
enable_force_move: True


#-------------------------#
#   MCUS                  #
#-------------------------#

## Main MCU (BTT Octopus)
##--------------------------------------------------------------------
[include configs/boards/btt_octopus.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2B002B000F50535556323420-if00
##--------------------------------------------------------------------


## Toolhead MCU (Fysetc H36 Combo V1.3 — CAN bus)
##--------------------------------------------------------------------
[include configs/boards/fysetc_h36_combo_v1.3.cfg]
[mcu h36]
canbus_uuid: 32136d025883
canbus_interface: can0
##--------------------------------------------------------------------


## Cartographer MCU (CAN bus)
##--------------------------------------------------------------------
[mcu scanner]
canbus_uuid: 93127851a80e
canbus_interface: can0

[scanner]
mcu: scanner
#   Offsets measured from the centre of the coil to the nozzle tip.
#   Measure carefully and update these before first print.
x_offset: 0
y_offset: 21              # ← measure and update this value
backlash_comp: 0.00914
sensor: cartographer
sensor_alt: carto
mesh_runs: 2
##--------------------------------------------------------------------


#---------------------#
#   ACCELEROMETER     #
#---------------------#

[adxl345]
cs_pin: scanner: PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    150, 150, 20


#-------------------------#
#   TEMPERATURE SENSORS   #
#-------------------------#

[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor SoC]
sensor_type: temperature_host

[temperature_sensor H36]
sensor_type: temperature_mcu
sensor_mcu: h36
min_temp: 0
max_temp: 100

[temperature_sensor Cartographer]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

[thermistor Trianglelab NTC100K B3950]
temperature1: 25.0
resistance1:  103180.0
temperature2: 150.0
resistance2:  1366.2
temperature3: 250.0
resistance3:  168.6

[temperature_sensor Chamber]
sensor_type: Trianglelab NTC100K B3950    # ← update if using a different sensor
sensor_pin: mcu:MCU_T2                   # TH2 connector on Octopus (PF6)


#-----------------------#
#   X/Y STEPPERS (AWD)  #
#-----------------------#
#
# AWD motor layout (looking down at gantry, front door at bottom):
#
#   [Y/Motor5]-----------[X/Motor6]
#        |                    |
#        |                    |
#   [X1/Motor4]---------[Y1/Motor7]
#              FRONT DOOR
#
# stepper_x  + stepper_x1  = A belt assembly (X carriage motion)
# stepper_y  + stepper_y1  = B belt assembly (Y carriage motion)
#
# IMPORTANT: Verify dir_pin polarity on first power-on.
# Command G1 X10 and confirm both X motors move the carriage in +X.
# Flip the ! on dir_pin of either stepper_x or stepper_x1 (not both)
# if the motors fight each other. Repeat for Y axis.

## Motor6 — X Primary (A drive, back-right)
[stepper_x]
step_pin: mcu:MCU_MOTOR6_STEP
dir_pin: mcu:MCU_MOTOR6_DIR            # verify polarity during commissioning
enable_pin: !mcu:MCU_MOTOR6_ENABLE
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_endstop: 300                  # ← adjust to match physical endstop position
position_max: 300
position_min: 0
homing_speed: 120
homing_positive_dir: true             # endstop at max (right/rear)
endstop_pin: ^h36:EXP_PC13            # X endstop wired to H36 expansion header PC13

[tmc2209 stepper_x]
uart_pin: mcu:MCU_MOTOR6_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


## Motor4 — X Secondary mirror (A drive, front-left)
[stepper_x1]
step_pin: mcu:MCU_MOTOR4_STEP
dir_pin: mcu:MCU_MOTOR4_DIR            # same polarity as stepper_x
enable_pin: !mcu:MCU_MOTOR4_ENABLE
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_x1]
uart_pin: mcu:MCU_MOTOR4_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


## Motor5 — Y Primary (B drive, back-left)
[stepper_y]
step_pin: mcu:MCU_MOTOR5_STEP
dir_pin: mcu:MCU_MOTOR5_DIR            # verify polarity during commissioning
enable_pin: !mcu:MCU_MOTOR5_ENABLE
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_endstop: 300                  # ← adjust to match physical endstop position
position_max: 300
position_min: 0
homing_speed: 120
homing_positive_dir: true
endstop_pin: ^mcu:MCU_TB           # Y endstop on PF3 (THB connector repurposed as digital input)

[tmc2209 stepper_y]
uart_pin: mcu:MCU_MOTOR5_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


## Motor7 — Y Secondary mirror (B drive, front-right)
[stepper_y1]
step_pin: mcu:MCU_MOTOR7_STEP
dir_pin: mcu:MCU_MOTOR7_DIR            # same polarity as stepper_y
enable_pin: !mcu:MCU_MOTOR7_ENABLE
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_y1]
uart_pin: mcu:MCU_MOTOR7_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#---------------#
#   Z STEPPERS  #
#---------------#
#
# Z motor layout (looking down at frame):
#
#   [Z1/Motor1]---------[Z2/Motor2]
#        |                   |
#        |                   |
#   [Z0/Motor0]---------[Z3/Motor3]
#                FRONT

## Motor0 — Z0 Front Left
[stepper_z]
step_pin: mcu:MCU_MOTOR0_STEP
dir_pin: !mcu:MCU_MOTOR0_DIR
enable_pin: !mcu:MCU_MOTOR0_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: probe:z_virtual_endstop  # Cartographer virtual endstop
position_max: 350
position_min: -5
homing_speed: 5
homing_retract_dist: 0               # required for Cartographer

[tmc2209 stepper_z]
uart_pin: mcu:MCU_MOTOR0_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


## Motor1 — Z1 Rear Left
[stepper_z1]
step_pin: mcu:MCU_MOTOR1_STEP
dir_pin: !mcu:MCU_MOTOR1_DIR
enable_pin: !mcu:MCU_MOTOR1_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: mcu:MCU_MOTOR1_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


## Motor2 — Z2 Rear Right
[stepper_z2]
step_pin: mcu:MCU_MOTOR2_1_STEP
dir_pin: !mcu:MCU_MOTOR2_1_DIR
enable_pin: !mcu:MCU_MOTOR2_1_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: mcu:MCU_MOTOR2_1_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


## Motor3 — Z3 Front Right
[stepper_z3]
step_pin: mcu:MCU_MOTOR3_STEP
dir_pin: !mcu:MCU_MOTOR3_DIR
enable_pin: !mcu:MCU_MOTOR3_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: mcu:MCU_MOTOR3_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#-----------------------#
#   QUAD GANTRY LEVEL   #
#-----------------------#

[quad_gantry_level]
gantry_corners:
    -35, -25
    338, 358
points:
    25,0
    25,250
    275,250
    275,0
speed: 300
horizontal_move_z: 5
retries: 50
retry_tolerance: 0.01
max_adjust: 10


#---------------------#
#   CARTOGRAPHER      #
#---------------------#

[bed_mesh]
zero_reference_position: 150, 150    # centre of the 300x300 bed
speed: 300
horizontal_move_z: 5
mesh_min: 25, 21
mesh_max: 275, 270
probe_count: 15, 15
algorithm: bicubic

[safe_z_home]
home_xy_position: 150, 150
z_hop: 10


#------------#
#  EXTRUDER  #
#------------#

# Dragon Ace hotend / PT1000 / on Fysetc H36 toolhead
[extruder]
step_pin: h36:E_STEP
dir_pin: !h36:E_DIR                   # verify direction — flip ! if extruder runs backwards
enable_pin: !h36:E_EN
rotation_distance: 47.088
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: h36:HE0
sensor_type: PT1000
sensor_pin: h36:TE0
pullup_resistor: 2200                # 2.2k pull-up on H36 board
max_extrude_only_distance: 110
max_extrude_cross_section: 5
min_temp: 10
max_temp: 300
min_extrude_temp: 170
pressure_advance: 0.05               # tune this value
pressure_advance_smooth_time: 0.040
control: pid                         # calibrated at 225°C
pid_Kp: 24.086
pid_Ki: 2.409
pid_Kd: 60.215

[tmc2209 extruder]
uart_pin: h36:E_UART
interpolate: False
run_current: 0.45
sense_resistor: 0.110
stealthchop_threshold: 0


#-----------------------#
#   HEATERS & FANS      #
#-----------------------#

[heater_bed]
heater_pin: mcu:MCU_HE0
sensor_type: NTC 100K MGB18-104F39050L32    # ← update if using a different bed thermistor
sensor_pin: mcu:MCU_T3                      # TH3 connector on Octopus (PF7)
max_power: 0.8
min_temp: 0
max_temp: 130
control: pid                         # calibrated at 115°C
pid_Kp: 45.157
pid_Ki: 1.569
pid_Kd: 324.852

# Dual part cooling fans on FAN1 + FAN2 (Klipper multi_pin for simultaneous control)
[multi_pin part_cooling_fans]
pins: h36:FAN1, h36:FAN2

[fan]
pin: multi_pin:part_cooling_fans     # part cooling — dual fans on FAN1 + FAN2
kick_start_time: 0.5

[heater_fan Hotend_Fan]
pin: h36:FAN0                        # hotend cooling fan — FAN0 connector on H36
tachometer_pin: h36:FAN0_TACH
tachometer_ppr: 2
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic Bed_Fans]
pin: mcu:MCU_FAN2               # PD12 — bed fans connector on Octopus
kick_start_time: 0.5

# Skirt fans on MCU FAN0 (PA8) and FAN1 (PE5) — controlled together via multi_pin
[multi_pin skirt_fans]
pins: mcu:MCU_FAN0, mcu:MCU_FAN1

[fan_generic Skirt_Fans]
pin: multi_pin:skirt_fans       # dual skirt fans on MCU FAN0 (PA8) + FAN1 (PE5)
kick_start_time: 0.5


#----------------------#
#   FILAMENT SENSORS   #
#----------------------#

[filament_switch_sensor extruder_sensor]
switch_pin: h36:IO4                  # top/upper filament sensor — IO.4 (PB1)
pause_on_runout: True

[filament_switch_sensor hotend_sensor]
switch_pin: ^h36:IO2                 # bottom/lower filament sensor — IO.2 (PA8)
pause_on_runout: True


#-----------#
#   LIGHTS  #
#-----------#

[neopixel Chamber_Light]
pin: mcu:MCU_NEOPIXEL
chain_count: 18                       # ← update to match your actual LED count
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.5

[delayed_gcode chamber_light_on_startup]
initial_duration: 1
gcode:
    SET_LED LED=Chamber_Light RED=0 GREEN=0 BLUE=0.3

[neopixel Toolhead_Led]
pin: h36:IO3                         # IO.3 connector — 5V neopixel output on H36
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0



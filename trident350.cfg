# This file contains the primary hardware configuration for a
# Voron Trident 350 printer.

#-------------------------#
#   INCLUDES              #
#-------------------------#

[include mainsail.cfg]
[include configs/printers/trident350/trident350_settings.cfg]
[include macros/macros.cfg]
[include macros/Line_Purge.cfg]
[include macros/Smart_Park.cfg]
[include macros/nozzle_brush.cfg]
[include macros/git_functions.cfg]
[include macros/toolhead_led.cfg]
#[include macros/hardware/bedfan.cfg]
#[include macros/hardware/caselights.cfg]
[include macros/hardware/filter.cfg]
#[include macros/kalico.cfg]
#[gcode_macro PROBE_CALIBRATE]
#gcode:
#    CARTOGRAPHER_CALIBRATE

[exclude_object]


#-------------------------#
#   PRINTER               #
#-------------------------#
[printer]
kinematics: corexy
max_accel: 10000
max_velocity: 500
max_z_velocity: 15             #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 250

#-------------------------#
#   MCUS                  #
#-------------------------#

## Main MCU (BTT Octopus Pro)
[include configs/boards/btt_octopus.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3B0043001150535556323420-if00

## Toolhead MCU (LDO NHK 36)
[include configs/boards/ldo_nhk_36.cfg]
[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320D791F-if00
restart_method: command

## Stealthmax PCB (V1)
[include configs/boards/stealthmax_v1.cfg]
[mcu max]
canbus_uuid: a30a20aeb0fc
is_non_critical: True

## Cartographer MCU
[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_614e_230017000443303459323220-if00
restart_method: command

[cartographer]
mcu: cartographer            
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 28                         
#    adjust for your cartographers offset from nozzle to middle of coil
verbose: no

[bed_mesh]
zero_reference_position: 175, 175    
#    set this to the middle of your bed
speed: 350
#    movement speed of toolhead during bed mesh
horizontal_move_z: 5
#    height of scanner during bed mesh scan
mesh_min: 25, 31
#    start point of bed mesh [X, Y]
mesh_max: 325, 310
#    end point of bed mesh [X, Y]
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0

[safe_z_home]
home_xy_position: 175,175
# Example home_xy_position: 175,175 - This would be for a 350 * 350mm bed. 
z_hop: 10

[adxl345]
cs_pin: cartographer: PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
#accel_per_hz: 125
probe_points:
    87, 90, 20


#-------------------------#
#   STEPPERS              #
#-------------------------#

[stepper_x]
step_pin: mcu:MCU_MOTOR0_STEP
dir_pin: !mcu:MCU_MOTOR0_DIR
enable_pin: !mcu:MCU_MOTOR0_ENABLE
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_endstop:345
position_max: 345
homing_speed: 150
#homing_positive_dir: false
endstop_pin: nhk:X_ENDSTOP
[tmc2209 stepper_x]
uart_pin: mcu:MCU_MOTOR0_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: mcu:MCU_MOTOR1_STEP
dir_pin: !mcu:MCU_MOTOR1_DIR
enable_pin: !mcu:MCU_MOTOR1_ENABLE
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_endstop: 360
position_max: 360
homing_speed: 150
endstop_pin: mcu:MCU_STOP1
[tmc2209 stepper_y]
uart_pin: mcu:MCU_MOTOR1_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z] # Z1 (Front Left)
step_pin: mcu:MCU_MOTOR2_1_STEP
dir_pin: mcu:MCU_MOTOR2_1_DIR
enable_pin: !mcu:MCU_MOTOR2_1_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32
position_max: 247
position_min: -1 
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
[tmc2209 stepper_z]
uart_pin: mcu:MCU_MOTOR2_1_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1] # Z2 (Rear)
step_pin: mcu:MCU_MOTOR3_STEP
dir_pin: mcu:MCU_MOTOR3_DIR
enable_pin: !mcu:MCU_MOTOR3_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32
[tmc2209 stepper_z1]
uart_pin: mcu:MCU_MOTOR3_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2] # Z3 (Front Right)
step_pin: mcu:MCU_MOTOR4_STEP
dir_pin: mcu:MCU_MOTOR4_DIR
enable_pin: !mcu:MCU_MOTOR4_ENABLE
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32
[tmc2209 stepper_z2]
uart_pin: mcu:MCU_MOTOR4_UART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: nhk:E_STEP
dir_pin: !nhk:E_DIR
enable_pin: !nhk:E_EN
heater_pin: nhk:HE_HEATER
sensor_pin: nhk:HE_TEMP
pullup_resistor: 2200
rotation_distance: 35.2
gear_ratio: 44:8, 25:17
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 1000
max_extrude_cross_section: 40
sensor_type: Generic 3950
min_temp: 10
max_temp: 315
max_power: 1.0
min_extrude_temp: 172
pressure_advance: 0.042
pressure_advance_smooth_time: 0.040
control: pid
pid_Kp: 43.292
pid_Ki: 16.977
pid_Kd: 27.599
[tmc2209 extruder]
uart_pin: nhk:E_UART
tx_pin: nhk:E_TX
interpolate: false
run_current: 0.7
sense_resistor: 0.100
stealthchop_threshold: 0

#-------------------------#
#   Z-TILT LEVELING       #
#-------------------------#

[z_tilt]
z_positions:
    -50, 18
    175, 398
    400, 18
points:
    30, 5
    175, 295
    320, 5
speed: 150
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075


#-------------------------#
#   HEATERS & FANS        #
#-------------------------#

[heater_bed]
heater_pin: mcu:MCU_HE0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: mcu:MCU_TB
max_power: 0.9
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 47.303 
pid_Ki: 2.160 
pid_Kd: 258.982

[fan]
pin: nhk:PC_FAN

[heater_fan Hotend_Fan]
pin: nhk:HE_FAN
tachometer_pin: nhk:HE_TACH
tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 0.70
tachometer_poll_interval: 0.0005

[fan_generic Bed_Fans]
pin: mcu:MCU_FAN1
kick_start_time: 0.5

[fan_generic Skirt_Fans]
pin: mcu:MCU_FAN0
kick_start_time: 0.5

[fan_generic MCU_Fan]
pin: mcu:MCU_FAN3
kick_start_time: 0.5

[fan_generic Filter]
pin: max:FILTER_FAN
tachometer_pin: max:FILTER_TACH
tachometer_ppr: 2

#-------------------------#
#   LIGHTS                #
#-------------------------#

[output_pin Chamber_Light]
pin: mcu:MCU_FAN5
pwm: true
cycle_time: 0.005

[delayed_gcode chamber_light_on_startup]
initial_duration: 1
gcode:
    SET_PIN PIN=Chamber_Light VALUE=0.5

[neopixel Toolhead_Led]
pin: nhk:RGB
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[output_pin act_led]
pin: !nhk:ACT_LED

#-------------------------#
#   SENSORS               #
#-------------------------#

[thermistor Trianglelab NTC100K B3950]
temperature1: 25.0
resistance1: 103180.0
temperature2: 150.0
resistance2: 1366.2
temperature3: 250.0
resistance3: 168.6

[temperature_sensor Chamber]
sensor_type: Trianglelab NTC100K B3950
sensor_pin: mcu:MCU_T0

[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host

[temperature_sensor mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90

[temperature_sensor Cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[filament_switch_sensor extruder_sensor]
switch_pin: nhk:FS_EXT
pause_on_runout: True

[filament_switch_sensor hotend_sensor]
switch_pin: nhk:FS_HE
pause_on_runout: True



#-------------------------#
#   Input Shaper          #
#-------------------------#
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 60.6
shaper_type_y: mzv
shaper_freq_y: 37.8

[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
# number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

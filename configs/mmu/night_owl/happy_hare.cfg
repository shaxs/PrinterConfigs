# ============================================================
# Night Owl MMU — Happy Hare Hardware Configuration
# ============================================================
# ERB v2 (RP2040) via CANbus — 2-gate Night Owl Type-B
#
# PREREQUISITES:
#   1. Install Happy Hare:
#        cd ~/Happy-Hare && ./install.sh
#      Use "-m NightOwl -n 2 -b ERBv2" if the script asks
#
#   2. Add HH software includes to your printer root config:
#        [include mmu/base/mmu_parameters.cfg]
#        [include mmu/base/mmu_sequence.cfg]
#        [include mmu/base/mmu_form_tip.cfg]
#        [include mmu/base/mmu_state.cfg]
#        [include mmu/base/mmu_software.cfg]
#        [include mmu/macros/mmu_macros.cfg]
#        (refer to HH docs for the full include list)
#
# Per-printer activation block (in micron.cfg / trident350.cfg):
#
#   # --- Night Owl: Happy Hare stack ---
#   # [mcu mmu] is per-printer (each board has a unique UUID — do NOT put it here)
#   [mcu mmu]
#   canbus_uuid: <your UUID>    # run: canbus_query.py can0
#   canbus_interface: can0
#
#   [include configs/mmu/night_owl/happy_hare.cfg]
#
#   # --- HH software layers (paths after install.sh) ---
#   [include mmu/base/mmu_parameters.cfg]
#   [include mmu/base/mmu_sequence.cfg]
#   ...
#
# NOTE: Do NOT also include hardware.cfg or afc.cfg alongside this file.
# ============================================================

[temperature_sensor MMU_MCU]
sensor_type: temperature_mcu
sensor_mcu: mmu
min_temp: 0
max_temp: 80


# ============================================================
# Pin Aliases  (HH MMU_* names → ERB v2 GPIO assignments)
#
# Cross-reference: HH alias name, GPIO, and AFC/ERB_v2 alias name
#
# | Function           | GPIO    | HH Alias           | ERB_v2 alias (AFC) |
# |--------------------|---------|--------------------|--------------------|
# | Gate 0 STEP        | gpio10  | MMU_GEAR_STEP      | LANE2_STEP         |
# | Gate 0 DIR         | gpio9   | MMU_GEAR_DIR       | LANE2_DIR          |
# | Gate 0 ENABLE      | gpio8   | MMU_GEAR_ENABLE    | LANE2_EN           |
# | Gate 0 UART        | gpio11  | MMU_GEAR_UART      | LANE2_UART         |
# | Gate 0 DIAG        | gpio13  | MMU_GEAR_DIAG      | LANE2_DIAG         |
# | Gate 1 STEP        | gpio16  | MMU_GEAR_STEP_1    | LANE1_STEP         |
# | Gate 1 DIR         | gpio15  | MMU_GEAR_DIR_1     | LANE1_DIR          |
# | Gate 1 ENABLE      | gpio14  | MMU_GEAR_ENABLE_1  | LANE1_EN           |
# | Gate 1 UART        | gpio17  | MMU_GEAR_UART_1    | LANE1_UART         |
# | Gate 1 DIAG        | gpio19  | MMU_GEAR_DIAG_1    | LANE1_DIAG         |
# | Selector endstop   | gpio24  | MMU_SEL_ENDSTOP    | LANE1_ENDSTOP      |
# | Servo              | gpio23  | MMU_SEL_SERVO      | MMU_SERVO          |
# | Encoder            | gpio22  | MMU_ENCODER        | MMU_ENCODER        |
# | NeoPixel           | gpio21  | MMU_NEOPIXEL       | MMU_NEOPIXEL       |
# | Pre-gate 0 sensor  | gpio12  | MMU_PRE_GATE_0     | HUB_SENSOR         |
# | Pre-gate 1 sensor  | gpio18  | MMU_PRE_GATE_1     | BUFFER_TRL         |
# | Buffer ADV signal  | gpio2   | MMU_SYNC_ADVANCE   | BUFFER_ADV         |
#
# Physical wiring verified against:
#   Happy Hare pin_defs file — PIN[ERBv2, *] entries
# ============================================================

[board_pins mmu]
mcu: mmu
aliases:
    # Gate 0 drive motor  (Lane 2 / gear slot on ERB v2)
    MMU_GEAR_UART=gpio11,   MMU_GEAR_STEP=gpio10,
    MMU_GEAR_DIR=gpio9,     MMU_GEAR_ENABLE=gpio8,
    MMU_GEAR_DIAG=gpio13,

    # Gate 1 drive motor  (Lane 1 / selector slot on ERB v2)
    MMU_GEAR_UART_1=gpio17, MMU_GEAR_STEP_1=gpio16,
    MMU_GEAR_DIR_1=gpio15,  MMU_GEAR_ENABLE_1=gpio14,
    MMU_GEAR_DIAG_1=gpio19,

    # Selector / VirtualSelector hardware
    MMU_SEL_ENDSTOP=gpio24,
    MMU_SEL_SERVO=gpio23,

    # Peripherals
    MMU_ENCODER=gpio22,
    MMU_NEOPIXEL=gpio21,

    # Filament presence sensors
    MMU_PRE_GATE_0=gpio12,      # Gate 0 path sensor  (HUB_SENSOR in AFC naming)
    MMU_PRE_GATE_1=gpio18,      # Gate 1 path sensor  (BUFFER_TRL in AFC naming)
    MMU_SYNC_ADVANCE=gpio2      # Buffer advance signal (BUFFER_ADV in AFC naming)


# ============================================================
# MMU Machine Definition
# ============================================================

[mmu_machine]
mmu_vendor: NightOwl
mmu_version: 2.0
num_gates: 2


# ============================================================
# Gear Steppers  (one per gate — Night Owl Type-B VirtualSelector)
#
# rotation_distance:
#   Calibrate with:  MMU_CALIBRATE_GEAR
#   Starting value 22.452 assumes no additional gear reduction.
#   Adjust if your Night Owl build uses different drive gears.
#
# dir_pin inversion:
#   If either motor feeds backward, add or remove '!' before
#   the relevant dir_pin value.
# ============================================================

# Gate 0 drive motor (Lane 2 slot — gpio10–13)
[stepper_mmu_gear]
step_pin: mmu:MMU_GEAR_STEP
dir_pin: mmu:MMU_GEAR_DIR
enable_pin: !mmu:MMU_GEAR_ENABLE
rotation_distance: 22.452       # calibrate with MMU_CALIBRATE_GEAR
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_mmu_gear]
uart_pin: mmu:MMU_GEAR_UART
run_current: 0.8                # A — NEMA14 safe; reduce to 0.5 if motor runs hot
hold_current: 0.2
diag_pin: ^mmu:MMU_GEAR_DIAG
interpolate: True
stealthchop_threshold: 999999
driver_SGTHRS: 60               # stallguard threshold — tune for reliable jam detection

# Gate 1 drive motor (Lane 1 slot — gpio16–19)
[stepper_mmu_gear_1]
step_pin: mmu:MMU_GEAR_STEP_1
dir_pin: mmu:MMU_GEAR_DIR_1
enable_pin: !mmu:MMU_GEAR_ENABLE_1
rotation_distance: 22.452       # calibrate with MMU_CALIBRATE_GEAR
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_mmu_gear_1]
uart_pin: mmu:MMU_GEAR_UART_1
run_current: 0.8                # A — NEMA14 safe; reduce to 0.5 if motor runs hot
hold_current: 0.2
diag_pin: ^mmu:MMU_GEAR_DIAG_1
interpolate: True
stealthchop_threshold: 999999
driver_SGTHRS: 60               # stallguard threshold — tune for reliable jam detection


# ============================================================
# Servo  (selects active filament path)
# Adjust minimum/maximum_pulse_width for your specific servo.
# ============================================================

[mmu_servo selector_servo]
pin: mmu:MMU_SEL_SERVO
maximum_mms: 200
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.00225


# ============================================================
# Encoder  (filament motion detection)
# Calibrate with:  MMU_CALIBRATE_ENCODER
# ============================================================

[mmu_encoder mmu_encoder]
encoder_pin: ^mmu:MMU_ENCODER
encoder_resolution: 1.5         # mm/count — calibrate with MMU_CALIBRATE_ENCODER
desired_headroom: 5.0
average_samples: 4
flowrate_calibration_length: 50


# ============================================================
# LED Strip
# chain_count:  1 status LED + 2 gate LEDs = 3 total
# Adjust chain_count if your build uses a different LED count.
# ============================================================

[neopixel mmu_leds]
pin: mmu:MMU_NEOPIXEL
chain_count: 3
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0


# ============================================================
# Sensors
# TurtleNeck buffer sync feedback:
#   Uncomment sync_feedback_tension_pin if a TurtleNeck
#   buffer is fitted and its advance signal is connected.
# ============================================================

[mmu_sensors]
# Filament presence at each gate entrance
pre_gate_switch_pin_0: ^mmu:MMU_PRE_GATE_0
pre_gate_switch_pin_1: ^mmu:MMU_PRE_GATE_1

# TurtleNeck sync feedback (uncomment if fitted):
# sync_feedback_tension_pin: ^mmu:MMU_SYNC_ADVANCE

# ============================================================
# NIGHT OWL MMU — Hardware Layer (AFC Stack)
# ============================================================
# Loads the ERB v2 board pin aliases and monitors MCU temperature.
# This is the AFC hardware layer — do NOT include alongside happy_hare.cfg.
#
# PREREQUISITES: [mcu erb_v2] must be declared in your printer root config
# before this include, along with its canbus_uuid. For example:
#
#   [mcu erb_v2]
#   canbus_uuid: <your 12-char UUID>   # run: canbus_query.py can0
#   canbus_interface: can0
#
#   [include configs/mmu/night_owl/hardware.cfg]  <- this file
#   [include configs/mmu/night_owl/afc.cfg]
#
# Pin mapping reference: configs/boards/erb_v2.cfg
# ============================================================

[include configs/boards/erb_v2.cfg]

# Monitor ERB v2 MCU temperature (visible in Mainsail/Fluidd).
[temperature_sensor NightOwl_MCU]
sensor_type: temperature_mcu
sensor_mcu: erb_v2

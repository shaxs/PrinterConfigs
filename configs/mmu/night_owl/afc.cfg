# ============================================================
# NIGHT OWL MMU — AFC (Automated Filament Changer) Config
# ============================================================
# Software layer for the Night Owl 2-lane MMU using AFC.
#
# REQUIRES: configs/mmu/night_owl/hardware.cfg included FIRST
#           in the printer root config (declares [mcu erb_v2]
#           and loads board pin aliases from configs/boards/erb_v2.cfg)
#
# TO ENABLE in your printer root config, uncomment both:
#   [include configs/mmu/night_owl/hardware.cfg]
#   [include configs/mmu/night_owl/afc.cfg]      <- this file
#
# Leave the following COMMENTED (mutually exclusive with this file):
#   #[include configs/mmu/night_owl/happy_hare.cfg]
#
# REFERENCE: ArmoredTurtle/AFC-Klipper-Add-On
#   templates/AFC_NightOwl_1.cfg
#   templates/AFC_Hardware-NightOwl.cfg
# ============================================================

# Required by AFC for MMU homing without the printer being homed.
# If force_move is already enabled elsewhere in your printer config,
# comment this section out here to avoid a duplicate-section error.

# ============================================================
# Pin Mapping  (AFC alias name → GPIO → HH cross-reference)
#
# | Function               | GPIO    | AFC alias (ERB_v2) | HH alias            |
# |------------------------|---------|--------------------|--------------------|
# | Lane 1 STEP            | gpio16  | LANE1_STEP         | MMU_GEAR_STEP_1    |
# | Lane 1 DIR             | gpio15  | LANE1_DIR          | MMU_GEAR_DIR_1     |
# | Lane 1 ENABLE          | gpio14  | LANE1_EN           | MMU_GEAR_ENABLE_1  |
# | Lane 1 UART            | gpio17  | LANE1_UART         | MMU_GEAR_UART_1    |
# | Lane 1 load sensor     | gpio3   | LANE1_TRIG         | (AFC only)         |
# | Lane 1 prep sensor     | gpio4   | LANE1_EXT          | (AFC only)         |
# | Lane 2 STEP            | gpio10  | LANE2_STEP         | MMU_GEAR_STEP      |
# | Lane 2 DIR             | gpio9   | LANE2_DIR          | MMU_GEAR_DIR       |
# | Lane 2 ENABLE          | gpio8   | LANE2_EN           | MMU_GEAR_ENABLE    |
# | Lane 2 UART            | gpio11  | LANE2_UART         | MMU_GEAR_UART      |
# | Lane 2 load sensor     | gpio5   | LANE2_TRIG         | (AFC only)         |
# | Lane 2 prep sensor     | gpio6   | LANE2_EXT          | (AFC only)         |
# | Hub filament sensor    | gpio12  | HUB_SENSOR         | MMU_PRE_GATE_0     |
# | Buffer advance signal  | gpio2   | BUFFER_ADV         | MMU_SYNC_ADVANCE   |
# | Buffer trail signal    | gpio18  | BUFFER_TRL         | MMU_PRE_GATE_1     |
# | NeoPixel               | gpio21  | MMU_NEOPIXEL       | MMU_NEOPIXEL       |
#
# Note: LANE1_TRIG/EXT and LANE2_TRIG/EXT (gpio3–6) are used only by AFC.
#   Happy Hare uses gpio12/gpio18 as its pre-gate sensors for the same gates.
# ============================================================

[force_move]
enable_force_move: True

# ============================================================
# NIGHT OWL UNIT DECLARATION
# ============================================================
# Declares the Night Owl as an AFC unit.
# Logical unit name "NightOwl" is distinct from the MCU name "erb_v2".
[AFC_NightOwl NightOwl]
hub: NightOwl_Hub       # References [AFC_hub NightOwl_Hub] below
extruder: extruder      # Must match the [extruder] section in your printer config
buffer: TN              # References [AFC_buffer TN] below (TurtleNeck)

# ============================================================
# LANE 1 STEPPER — Selector Side
# Pin aliases resolved via [board_pins ERB_v2] in hardware.cfg
# ============================================================
[AFC_stepper lane1]
unit: NightOwl:1
extruder: extruder
step_pin: erb_v2:LANE1_STEP
dir_pin: erb_v2:LANE1_DIR
enable_pin: !erb_v2:LANE1_EN
microsteps: 16
rotation_distance: 4.65         # BMG-style Bondtech gear — calibrate if needed
dist_hub: 45.0                  # mm from this stepper to hub — TODO: measure for your build
park_dist: 10                   # mm to retract when parking
load: ^erb_v2:LANE1_TRIG        # Pre-gate filament detection sensor
prep: ^erb_v2:LANE1_EXT         # Extension/buffer sensor

[tmc2209 AFC_stepper lane1]
uart_pin: erb_v2:LANE1_UART
uart_address: 0
run_current: 0.8                # A — suitable for NEMA14; reduce to 0.6 if motor runs hot
sense_resistor: 0.110

# ============================================================
# LANE 2 STEPPER — Gear/Drive Side
# Pin aliases resolved via [board_pins ERB_v2] in hardware.cfg
# ============================================================
[AFC_stepper lane2]
unit: NightOwl:2
extruder: extruder
step_pin: erb_v2:LANE2_STEP
dir_pin: !erb_v2:LANE2_DIR      # Inverted — verify motor direction, remove ! if reversed
enable_pin: !erb_v2:LANE2_EN
microsteps: 16
rotation_distance: 4.65         # BMG-style Bondtech gear — calibrate if needed
dist_hub: 45.0                  # mm from this stepper to hub — TODO: measure for your build
park_dist: 10                   # mm to retract when parking
load: ^erb_v2:LANE2_TRIG        # Pre-gate filament detection sensor
prep: ^erb_v2:LANE2_EXT         # Extension/buffer sensor

[tmc2209 AFC_stepper lane2]
uart_pin: erb_v2:LANE2_UART
uart_address: 0
run_current: 0.8                # A — suitable for NEMA14; reduce to 0.6 if motor runs hot
sense_resistor: 0.110

# ============================================================
# HUB SENSOR
# HUB_SENSOR pin alias resolved via [board_pins ERB_v2] in hardware.cfg
# ============================================================
[AFC_hub NightOwl_Hub]
afc_bowden_length: 500.0        # mm hub to extruder entry — TODO: measure for your build
move_dis: 50                    # mm to advance filament through the hub during load
cut: False                      # Set True only if hub has a cutter installed
# Hub cutter settings — only needed when cut: True above
#cut_cmd: AFC
#cut_dist: 200                  # mm of filament to cut off
#cut_clear: 120                 # mm to retract back from hub after cut
#cut_min_length: 300.0
#cut_servo_pass_angle: 10       # Servo angle to align Bowden tube for loading
#cut_servo_clip_angle: 180      # Servo angle for cut stroke
#cut_servo_prep_angle: 80       # Servo angle to prepare for cut
switch_pin: ^erb_v2:HUB_SENSOR  # Hub filament presence sensor

# ============================================================
# TURTLENECK BUFFER
# BUFFER_ADV / BUFFER_TRL pin aliases resolved via [board_pins ERB_v2]
# ============================================================
[AFC_buffer TN]
advance_pin: ^erb_v2:BUFFER_ADV     # Buffer advance signal
trailing_pin: ^erb_v2:BUFFER_TRL    # Buffer trail signal
multiplier_high: 1.05           # Feed-more factor when buffer is advancing (default 1.05)
multiplier_low: 0.95            # Feed-less factor when buffer is trailing (default 0.95)

# ============================================================
# TOOLHEAD / EXTRUDER SENSOR
# ============================================================
[AFC_extruder extruder]
# pin_tool_start: The filament sensor at/in the toolhead.
# Set this to match your toolhead board and sensor pin.
# Examples:
#   LDO NHK v2.4 (Trident):  nhk:gpio12
#   BTT EBB36  (Micron):      EBBCan:gpio23
pin_tool_start: enter_tool_pin  # TODO: replace with actual sensor pin for this printer
# pin_tool_end: ^!nhk:gpio12   # Uncomment if second sensor is present after extruder
tool_stn: 113.52                # mm from toolhead sensor to nozzle tip
                                # See https://armoredturtle.xyz/docs for how to calculate
tool_stn_unload: 100            # mm to retract during unload sequence
tool_sensor_after_extruder: 0   # mm — set to 0 if no second sensor after extruder
tool_unload_speed: 25           # mm/s
tool_load_speed: 25             # mm/s

# ============================================================
# NIGHT OWL ONBOARD LEDs
# MMU_NEOPIXEL pin alias resolved via [board_pins ERB_v2]
# ============================================================
# Defines the Night Owl's onboard RGB LED chain.
# AFC LED status control is configured separately in AFC.cfg (led_name).
[neopixel NightOwl_led]
pin: erb_v2:MMU_NEOPIXEL
chain_count: 2                  # 1 LED per lane on the Night Owl
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

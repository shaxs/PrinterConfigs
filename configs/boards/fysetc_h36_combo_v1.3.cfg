# This file contains the board pin aliases for the
# Fysetc H36 Combo V1.3 Toolhead board.
# MCU: STM32G0B1T3 (CAN bus or USB)
# Reference: https://wiki.fysetc.com/docs/H36-Combo

[board_pins fysetc_h36_combo_v1.3]
mcu: h36
aliases:
    # --- Extruder Motor (onboard TMC2209, single-wire UART) ---
    E_STEP=PB9,
    E_DIR=PB8,
    E_EN=PB7,
    E_UART=PC14,
    E_DIAG=PC15,

    # --- IO (endstops / probe / RGB, 3.3V-24V selectable) ---
    IO0=PA15,           # IO.0+1 connector — endstop / signal input
    IO1=PC7,            # IO.0+1 connector — endstop / signal input
    IO2=PA8,            # IO.2 — Z probe / Cartographer / Klicky (PH-2P)
    IO3=PA10,           # IO.3 — 5V RGB/neopixel or general signal (PH2.0-3P)
    IO4=PB1,            # IO.4 — 24V signal (PH2.0-3P, same as IO.0+1)

    # --- Fans ---
    FAN0=PA9,           # Fan0 — hotend fan (3-pin, tachometer capable, 0.5A max)
    FAN0_TACH=PC6,      # Fan0 tachometer input
    FAN1=PB15,          # Fan1 — part cooling fan (3-pin, tachometer capable, 0.5A max)
    FAN1_TACH=PB14,     # Fan1 tachometer input
    FAN2=PB13,          # Fan2 — auxiliary 2-pin fan (24V, 0.5A max)
    FAN3=PB0,           # Fan3 — auxiliary 2-pin fan signal (24V, 0.5A max)
    FAN3_V=PA5,         # Fan3 — 24V fan power/voltage enable

    # --- Heater and Thermistor ---
    HE0=PA7,            # HE0 — heating element (MOSFET output, KF128, 5A max)
    TE0=PA6,            # TE0 — thermistor input (2.2k 0.1% pull-up, 100K or PT1000)

    # --- Expansion Header (3.3V GPIO) ---
    EXP_PB5=PB5,        # 3.3V GPIO expansion
    EXP_PB4=PB4,        # 3.3V GPIO expansion
    EXP_PB3=PB3,        # 3.3V GPIO expansion
    EXP_PC13=PC13,      # 3.3V GPIO expansion

    # --- ADXL345 Accelerometer (SPI2 hardware bus) ---
    ADXL_CS=PB12,
    ADXL_SCLK=PB10,
    ADXL_MOSI=PB11,
    ADXL_MISO=PB2

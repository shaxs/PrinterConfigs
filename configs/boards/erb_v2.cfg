# This file contains the board pin aliases for the
# FYSETC ERB v2 (RP2040-based) MCU used in the Night Owl MMU.
#
# IMPORTANT: Do NOT include this file directly in your printer root config.
#   It is included automatically by configs/mmu/night_owl/hardware.cfg (AFC stack).
#   Happy Hare uses its own [board_pins mmu] section in happy_hare.cfg.
#
# Every printer that uses the AFC stack must declare:
#   [mcu erb_v2]
#   canbus_uuid: <your 12-char UUID>
#   canbus_interface: can0
#   [include configs/mmu/night_owl/hardware.cfg]
#
# Pin assignments cross-verified against:
#   ArmoredTurtle/AFC-Klipper-Add-On/config/mcu/ERB_2.0.cfg
#   Happy Hare NightOwl mmu_hardware.cfg template

[board_pins ERB_v2]
mcu: erb_v2
aliases:
aliases_lane1_motor:
    LANE1_STEP=gpio16,
    LANE1_DIR=gpio15,
    LANE1_EN=gpio14,
    LANE1_UART=gpio17,
    LANE1_DIAG=gpio19,
    LANE1_ENDSTOP=gpio24
aliases_lane2_motor:
    LANE2_STEP=gpio10,
    LANE2_DIR=gpio9,
    LANE2_EN=gpio8,
    LANE2_UART=gpio11,
    LANE2_DIAG=gpio13
aliases_lane_sensors:
    LANE1_TRIG=gpio3,
    LANE1_EXT=gpio4,
    LANE2_TRIG=gpio5,
    LANE2_EXT=gpio6
aliases_hub_buffer:
    BUFFER_ADV=gpio2,
    HUB_SENSOR=gpio12,
    BUFFER_TRL=gpio18
aliases_peripherals:
    MMU_NEOPIXEL=gpio21,
    MMU_ENCODER=gpio22,
    MMU_SERVO=gpio23
aliases_extended:
    EXT_SENSOR3=gpio26,
    EXT_SENSOR4=gpio27,
    EXT_SENSOR5=gpio28,
    EXT_SENSOR6=gpio29

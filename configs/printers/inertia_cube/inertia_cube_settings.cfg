#####################################################################
#                                                                   #
#      Inertia Cube - Printer Specific Settings Profile             #
#                                                                   #
#####################################################################
# This file contains all the settings, variables, and parameters
# that are specific to the Inertia Cube printer's hardware configuration.
#
# NOTE: This file is a placeholder generated during the hardware config
# phase. Full settings will be populated in the inertia-cube-settings-profile
# feature. Update the values below before first use.

[gcode_macro _CLIENT_VARIABLE]
description: "Holds variables for Mainsail and other general printer settings."
# --- Mainsail UI/Pause Settings ---
variable_use_custom_pos:      False
variable_custom_park_x:       150
variable_custom_park_y:       150
variable_custom_park_dz:      5.0
variable_speed_hop:           15.0
variable_speed_move:          100.0
variable_park_at_cancel:      False
variable_park_at_cancel_x:    None
variable_park_at_cancel_y:    None
# --- Retraction Settings ---
variable_retract:             1.0
variable_cancel_retract:      5.0
variable_speed_retract:       30.0
variable_unretract:           1.0
variable_speed_unretract:     30.0
variable_use_fw_retract:      False
# --- Bed Fan Settings ---
variable_bed_fan_on_temp:     80
gcode:
    # This macro section is required for the macro to load correctly.

[gcode_macro _FILAMENT_SETTINGS]
description: "Holds variables for filament loading and unloading."
# --- Loading Settings ---
variable_load_temp:           220.0
variable_load_feed_speed:     30.0
variable_load_fast_speed:     100.0
variable_load_length:         110.0
variable_purge_length:        25.0
# --- Unloading & Tip Forming Settings ---
variable_unload_temp:             220.0
variable_unload_fast_speed:       100.0
variable_unload_length:           85.0
variable_tip_forming_cycles:      5
variable_tip_forming_move_length: 5
variable_tip_forming_move_speed:  25.0
# --- Purge Bucket Location ---
variable_use_purge_bucket:    False      # No bucket/brush yet
variable_purge_bucket_x:      0
variable_purge_bucket_y:      0
variable_purge_bucket_z:      0
gcode:
    # This macro section is required for the macro to load correctly.

[gcode_macro _CHAMBER_SETTINGS]
description: "Holds variables for chamber heating and heat soak routines."
variable_enabled:              True
variable_target_temp:          40       # ← adjust to your default chamber target
variable_heat_timeout_minutes: 20
gcode:
    # This macro section is required for the macro to load correctly.

[gcode_macro _BRUSH_SETTINGS]
description: "Holds variables for the nozzle brush routine."
variable_enabled:             False     # No brush installed yet
variable_start_z:             1.0       # height of brush bristles (Z=1 when installed)
variable_wipe_speed:          200
variable_wipe_count:          4
variable_brush_x:             0
variable_brush_y:             0
variable_safe_x:              150
variable_safe_y:              150
gcode:
    # This macro section is required for the macro to load correctly.
